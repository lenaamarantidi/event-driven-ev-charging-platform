    networks:
      - saasplug-points-network
    volumes:
      - points-blue-data:/var/lib/mysql
      - ./db/central-db.sql:/docker-entrypoint-initdb.d/01-central.sql:ro
    restart: unless-stopped

  points-central:
    image: mariadb:11
    container_name: points-central
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: central
    ports:
      - "${points_db_central_port}:3306"
