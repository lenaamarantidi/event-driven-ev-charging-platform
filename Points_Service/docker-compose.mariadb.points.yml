services:
  points-red:
    image: mariadb:11
    container_name: points-red
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: central
    ports:
      - "${points_db_red_port}:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saasplug-points-network
    volumes:
      - points-red-data:/var/lib/mysql
      - ./db/central-db.sql:/docker-entrypoint-initdb.d/01-central.sql:ro
    restart: unless-stopped

  points-green:
    image: mariadb:11
    container_name: points-green
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: central
    ports:
