      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saasplug-points-network
    volumes:
      - points-central-data:/var/lib/mysql
      - ./db/central-db.sql:/docker-entrypoint-initdb.d/01-central.sql:ro
    restart: unless-stopped

networks:
  saasplug-points-network:
    driver: bridge

volumes:
  points-red-data:
  points-green-data:
  points-blue-data:
  points-central-data:




