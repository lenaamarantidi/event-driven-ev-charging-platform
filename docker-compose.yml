services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: saasplug-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # MySQL Central Database
  mysql-central:
    image: mysql:8.0
    container_name: saasplug-mysql-central
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_central
    ports:
      - "3306:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-central-data:/var/lib/mysql
      - ./databases/central-db.sql:/docker-entrypoint-initdb.d/01-central.sql

  # MySQL Statistics Database
  mysql-statistics:
    image: mysql:8.0
    container_name: saasplug-mysql-statistics
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_statistics
    ports:
      - "3307:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-statistics-data:/var/lib/mysql
      - ./databases/statistics-db.sql:/docker-entrypoint-initdb.d/01-statistics.sql

  # MySQL Billing Database
  mysql-billing:
    image: mysql:8.0
    container_name: saasplug-mysql-billing
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_billing
    ports:
      - "3308:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-billing-data:/var/lib/mysql
      - ./databases/billing-db.sql:/docker-entrypoint-initdb.d/01-billing.sql

  # MySQL Red Provider Database
  mysql-red:
    image: mysql:8.0
    container_name: saasplug-mysql-red
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_red
    ports:
      - "3309:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-red-data:/var/lib/mysql
      - ./databases/provider-db.sql:/docker-entrypoint-initdb.d/01-provider.sql

  # MySQL Green Provider Database
  mysql-green:
    image: mysql:8.0
    container_name: saasplug-mysql-green
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_green
    ports:
      - "3310:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-green-data:/var/lib/mysql
      - ./databases/provider-db.sql:/docker-entrypoint-initdb.d/01-provider.sql

  # MySQL Blue Provider Database
  mysql-blue:
    image: mysql:8.0
    container_name: saasplug-mysql-blue
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_blue
    ports:
      - "3311:3306"
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-blue-data:/var/lib/mysql
      - ./databases/provider-db.sql:/docker-entrypoint-initdb.d/01-provider.sql

  # PostgreSQL Database for Points, Reservations and Billing
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: saasplug-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: points_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./databases/postgres-init.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro

  # Central Service
  central-service:
    build:
      context: ./Points_Service
    container_name: saasplug-central
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      POINTS_DB_URL: postgresql://postgres:password@postgres:5432/points_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Reservation Service
  reservation-service:
    build:
      context: ./Reservation_Service
    container_name: saasplug-reservation
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      NODE_ENV: production
      RESERVATIONS_DB_URL: postgresql://postgres:password@postgres:5432/reservations_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/redPlug/api
      GREENPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/greenPlug/api
      BLUEPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/bluePlug/api
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Statistics Service
  # (Not present as a separate folder in this repository; statistics endpoints
  # are provided by the Points/Reservation services. This block intentionally
  # left commented out to avoid build failures.)

  # Billing Service
  billing-service:
    build:
      context: ./Billing_Service
    container_name: saasplug-billing
    ports:
      - "3108:3108"
    environment:
      PORT: 3108
      NODE_ENV: production
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: billing_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Map Service
  map-service:
    build:
      context: ./Map_UI_Service
    container_name: saasplug-map
    ports:
      - "3105:3105"
    environment:
      PORT: 3105
      NODE_ENV: production
    depends_on:
      mysql-central:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Sync Service (no port, runs as background worker)
  sync-service:
    build:
      context: ./Collector_Service
    container_name: saasplug-sync
    environment:
      NODE_ENV: production
      DB_HOST: mysql-central
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/redPlug/api
      GREENPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/greenPlug/api
      BLUEPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/bluePlug/api
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql-central:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Provider API Service (OpenAPI 3.1.0)
  provider-api-service:
    build:
      context: .
      dockerfile: Provider_API_Service/Dockerfile
    container_name: saasplug-provider-api
    ports:
      - "3200:3200"
    environment:
      PORT: 3200
      NODE_ENV: production
      REDPLUG_BASE_URL: https://davinci.softlab.ntua.gr/saas26/redPlug/api
      GREENPLUG_BASE_URL: https://davinci.softlab.ntua.gr/saas26/greenPlug/api
      BLUEPLUG_BASE_URL: https://davinci.softlab.ntua.gr/saas26/bluePlug/api
    networks:
      - saasplug-network
    restart: unless-stopped

networks:
  saasplug-network:
    driver: bridge

volumes:
  rabbitmq-data:
  mysql-central-data:
  mysql-statistics-data:
  mysql-billing-data:
  mysql-red-data:
  mysql-green-data:
  mysql-blue-data:
  postgres-data:
