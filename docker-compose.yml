services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: saasplug-rabbitmq
    ports:
      - "5523:5672"    # AMQP port
      - "5524:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # HTTP Message Broker Service
  message-broker:
    build:
      context: ./message_broker
    container_name: saasplug-message-broker
    ports:
      - "5511:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_STARTUP_RETRIES: 30
      RABBITMQ_STARTUP_RETRY_DELAY_MS: 2000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # MariaDB Central Database
  mysql-central:
    image: mariadb:11
    container_name: saasplug-mysql-central
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: central
    ports:
      - "6911:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mysql-central-data:/var/lib/mysql
      - ./Points_Service/db/central-db.sql:/docker-entrypoint-initdb.d/01-central.sql

  # MariaDB for Red Provider Adapter
  mariadb-red:
    image: mariadb:11
    container_name: saasplug-mariadb-red
    environment:
      TZ: Europe/Athens
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: red_provider_db
      MYSQL_USER: red_user
      MYSQL_PASSWORD: red_pass
    ports:
      - "7011:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-red-data:/var/lib/mysql
    restart: unless-stopped

  # MariaDB for Green Provider Adapter
  mariadb-green:
    image: mariadb:11
    container_name: saasplug-mariadb-green
    environment:
      TZ: Europe/Athens
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: green_provider_db
      MYSQL_USER: green_user
      MYSQL_PASSWORD: green_pass
    ports:
      - "7111:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-green-data:/var/lib/mysql
    restart: unless-stopped

  # MariaDB for Blue Provider Adapter
  mariadb-blue:
    image: mariadb:11
    container_name: saasplug-mariadb-blue
    environment:
      TZ: Europe/Athens
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blue_provider_db
      MYSQL_USER: blue_user
      MYSQL_PASSWORD: blue_pass
    ports:
      - "7211:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-blue-data:/var/lib/mysql
    restart: unless-stopped

  # MariaDB Database for Reservation Service
  mariadb-reservations:
    image: mariadb:11
    container_name: saasplug-mariadb-reservations
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reservation_db
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_pass
    ports:
      - "7311:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-reservations-data:/var/lib/mysql
      - ./Reservation_Service/db/schema.sql:/docker-entrypoint-initdb.d/01-reservation.sql
    restart: unless-stopped

  # MariaDB for Provider Management Service
  mariadb-provider:
    image: mariadb:11
    container_name: saasplug-mariadb-provider
    environment:
      TZ: Europe/Athens
      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: provider_db
      MYSQL_USER: provider_user
      MYSQL_PASSWORD: provider_pass
    ports:
      - "7411:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-provider-data:/var/lib/mysql
      - ./Provider_Management_Service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  # Central Service
  central-service:
    build:
      context: ./Points_Service
    container_name: saasplug-central
    ports:
      - "5512:3001"
    environment:
      PORT: 3001
      SERVICE: central
      NODE_ENV: production
      MARIADB_HOST: mysql-central
      MARIADB_PORT: 3306
      MARIADB_DB: central
      MARIADB_USER: root
      MARIADB_PASSWORD: root
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SYNC_INGEST_TOKEN: sync-ingest-dev-token
      ADAPTER_SYNC_REQUEST_EXCHANGE: adapter.sync.requests
      POINTS_RPC_EXCHANGE: points.rpc
      RESERVATION_TIMEZONE: Europe/Athens
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql-central:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Reservation Service
  reservation-service:
    build:
      context: ./Reservation_Service
    container_name: saasplug-reservation
    ports:
      - "5513:3009"
    environment:
      PORT: 3009
      NODE_ENV: production
      DB_HOST: mariadb-reservations
      DB_PORT: 3306
      DB_USER: reservation_user
      DB_PASSWORD: reservation_pass
      DB_NAME: reservation_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADAPTER_SYNC_REQUEST_EXCHANGE: adapter.sync.requests
      POINTS_RPC_EXCHANGE: points.rpc
      REDPLUG_ADAPTER_URL: http://provider-adapter-redplug:3111
      GREENPLUG_ADAPTER_URL: http://provider-adapter-greenplug:3112
      BLUEPLUG_ADAPTER_URL: http://provider-adapter-blueplug:3113
      # Provider API URLs/KEYs are configured in adapter services (they call the external provider APIs)
    depends_on:
      rabbitmq:
        condition: service_healthy
      mariadb-reservations:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Statistics Service
  # (Not present as a separate folder in this repository; statistics endpoints
  # are provided by the Points/Reservation services. This block intentionally
  # left commented out to avoid build failures.)

  # Billing Service
  billing-service:
    build:
      context: ./Billing_Service
    container_name: saasplug-billing
    ports:
      - "5514:3103"
    environment:
      PORT: 3103
      NODE_ENV: production
      DB_HOST: mariadb-billing
      DB_PORT: 3306
      DB_USER: billing_user
      DB_PASSWORD: billing_pass
      DB_NAME: billing_db
      ANALYTICS_SERVICE_URL: http://analytics-service:3106
      MESSAGE_BROKER_URL: http://message-broker:3003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      message-broker:
        condition: service_healthy
      mariadb-billing:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # MariaDB for Billing Service
  mariadb-billing:
    image: mariadb:11
    container_name: saasplug-mariadb-billing
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing_db
      MYSQL_USER: billing_user
      MYSQL_PASSWORD: billing_pass
    ports:
      - "7911:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-billing-data:/var/lib/mysql
      - ./Billing_Service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./Payment_Service
    container_name: saasplug-payment
    ports:
      - "5515:3107"
    environment:
      PORT: 3107
      NODE_ENV: production
      DB_HOST: mariadb-payment
      DB_PORT: 3306
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: payment_db
      MESSAGE_BROKER_URL: http://message-broker:3003
    depends_on:
      message-broker:
        condition: service_healthy
      mariadb-payment:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # MariaDB for Payment Service
  mariadb-payment:
    image: mariadb:11
    container_name: saasplug-mariadb-payment
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
    ports:
      - "8111:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-payment-data:/var/lib/mysql
      - ./Payment_Service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  # Provider Management Service
  provider-management-service:
    build:
      context: ./Provider_Management_Service
    container_name: saasplug-provider-mgmt
    ports:
      - "5516:3101"
    environment:
      PORT: 3101
      NODE_ENV: production
      DB_HOST: mariadb-provider
      DB_USER: provider_user
      DB_PASSWORD: provider_pass
      DB_NAME: provider_db
    depends_on:
      mariadb-provider:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # MariaDB for Auth Service
  mariadb-auth:
    image: mariadb:11
    container_name: saasplug-mariadb-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "8311:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-auth-data:/var/lib/mysql
      - ./Auth_Service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./Auth_Service
    container_name: saasplug-auth
    ports:
      - "5517:3100"
    environment:
      PORT: 3100
      NODE_ENV: production
      DB_HOST: mariadb-auth
      DB_PORT: 3306
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      DB_NAME: auth_db
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRY: 24h
    depends_on:
      mariadb-auth:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # MariaDB for Analytics Service
  mariadb-analytics:
    image: mariadb:11
    container_name: saasplug-mariadb-analytics
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: analytics_db
      MYSQL_USER: analytics_user
      MYSQL_PASSWORD: analytics_pass
    ports:
      - "8511:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasplug-network
    volumes:
      - mariadb-analytics-data:/var/lib/mysql
      - ./Analytics_Service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

  # Analytics Service
  analytics-service:
    build:
      context: ./Analytics_Service
    container_name: saasplug-analytics
    ports:
      - "5518:3106"
    environment:
      PORT: 3106
      NODE_ENV: production
      DB_HOST: mariadb-analytics
      DB_PORT: 3306
      DB_USER: analytics_user
      DB_PASSWORD: analytics_pass
      DB_NAME: analytics_db
      MESSAGE_BROKER_URL: http://message-broker:3003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      message-broker:
        condition: service_healthy
      mariadb-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Map Service
  map-service:
    build:
      context: ./Map_UI_Service
    container_name: saasplug-map
    ports:
      - "5519:3105"
    environment:
      PORT: 3105
      NODE_ENV: production
    depends_on:
      mysql-central:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  # Sync Service removed because Collector_Service directory is missing.
  # sync-service:
  #   build:
  #     context: ./Collector_Service
  #   container_name: saasplug-sync
  #   environment:
  #     NODE_ENV: production
  #     DB_HOST: mysql-central
  #     DB_USER: root
  #     DB_PASSWORD: root
  #     RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  #     REDPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/redPlug/api
  #     GREENPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/greenPlug/api
  #     BLUEPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/bluePlug/api
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     mysql-central:
  #       condition: service_healthy
  #   networks:
  #     - saasplug-network
  #   restart: unless-stopped

  # Provider API Service (OpenAPI 3.1.0)
  # Provider Adapter services (one per provider)
  provider-adapter-redplug:
    build:
      context: ./Provider_Adapter_redPlug
    container_name: saasplug-provider-adapter-redplug
    ports:
      - "5520:3111"
    environment:
      PORT: 3111
      NODE_ENV: production
      DB_HOST: mariadb-red
      DB_PORT: 3306
      DB_USER: red_user
      DB_PASSWORD: red_pass
      DB_NAME: red_provider_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADAPTER_SYNC_REQUEST_EXCHANGE: adapter.sync.requests
      REDPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/redPlug/api
      REDPLUG_API_KEY: "sk_saas_5dec282b47047b6eced41e64"
      POINTS_SERVICE_URL: http://central-service:3001
      ADAPTER_SYNC_INTERVAL_MS: 86400000
      SYNC_INGEST_TOKEN: sync-ingest-dev-token
    depends_on:
      mariadb-red:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  provider-adapter-greenplug:
    build:
      context: ./Provider_Adapter_greenPlug
    container_name: saasplug-provider-adapter-greenplug
    ports:
      - "5521:3112"
    environment:
      PORT: 3112
      NODE_ENV: production
      DB_HOST: mariadb-green
      DB_PORT: 3306
      DB_USER: green_user
      DB_PASSWORD: green_pass
      DB_NAME: green_provider_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADAPTER_SYNC_REQUEST_EXCHANGE: adapter.sync.requests
      GREENPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/greenPlug/api
      GREENPLUG_API_KEY: "sk_saas_5dec282b47047b6eced41e64"
      POINTS_SERVICE_URL: http://central-service:3001
      ADAPTER_SYNC_INTERVAL_MS: 86400000
      SYNC_INGEST_TOKEN: sync-ingest-dev-token
    depends_on:
      mariadb-green:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  provider-adapter-blueplug:
    build:
      context: ./Provider_Adapter_bluePlug
    container_name: saasplug-provider-adapter-blueplug
    ports:
      - "5522:3113"
    environment:
      PORT: 3113
      NODE_ENV: production
      DB_HOST: mariadb-blue
      DB_PORT: 3306
      DB_USER: blue_user
      DB_PASSWORD: blue_pass
      DB_NAME: blue_provider_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADAPTER_SYNC_REQUEST_EXCHANGE: adapter.sync.requests
      BLUEPLUG_API_URL: https://davinci.softlab.ntua.gr/saas26/bluePlug/api
      BLUEPLUG_API_KEY: "sk_saas_5dec282b47047b6eced41e64"
      POINTS_SERVICE_URL: http://central-service:3001
      ADAPTER_SYNC_INTERVAL_MS: 86400000
      SYNC_INGEST_TOKEN: sync-ingest-dev-token
    depends_on:
      mariadb-blue:
        condition: service_healthy
    networks:
      - saasplug-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./API_Gateway
    container_name: saasplug-api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      PORT: ${API_GATEWAY_PORT}
      HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:3100
      PROVIDER_SERVICE_URL: http://provider-management-service:3101
      POINTS_SERVICE_URL: http://central-service:3001
      RESERVATION_SERVICE_URL: http://reservation-service:3009
      BILLING_SERVICE_URL: http://billing-service:3103
      PAYMENT_SERVICE_URL: http://payment-service:3107
      ANALYTICS_SERVICE_URL: http://analytics-service:3106
      MAP_SERVICE_URL: http://map-service:3105
      PROVIDER_API_SERVICE_URL: http://provider-adapter-redplug:3111
    depends_on:
      - auth-service
      - provider-management-service
      - central-service
      - reservation-service
      - billing-service
      - payment-service
      - analytics-service
      - map-service
      - provider-adapter-redplug
      - provider-adapter-greenplug
      - provider-adapter-blueplug
    networks:
      - saasplug-network
    restart: unless-stopped

  frontend-service:
    build:
      context: ./Frontend_Service
    container_name: saasplug-frontend
    ports:
      - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    environment:
      PORT: ${FRONTEND_SERVICE_PORT}
      NODE_ENV: production
    depends_on:
      - api-gateway
    networks:
      - saasplug-network
    restart: unless-stopped

networks:
  saasplug-network:
    driver: bridge

volumes:
  rabbitmq-data:
  mysql-central-data:
  mariadb-reservations-data:
  mariadb-provider-data:
  mariadb-analytics-data:
  mariadb-auth-data:
  mariadb-billing-data:
  mariadb-payment-data:
  mariadb-red-data:
  mariadb-green-data:
  mariadb-blue-data:
